schema = 1

# Emulator self-tests, one per chip; CI runs them with
# scripts/test_emulator.py. The fuller hardware self-tests are in
# tests/hardware and run on real boards with scripts/test_pico.py.
[targets.pico]
entry = "pico.dodo"
board = "pico"

[targets.pico2]
entry = "pico2.dodo"
board = "pico2"
