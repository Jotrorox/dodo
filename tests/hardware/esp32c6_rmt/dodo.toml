# threshold and glitch filter, loops, and WS2812 LEDs; run with
# `python3 scripts/test_esp32c6.py -O 2 --project tests/hardware/esp32c6_rmt`
# (two checks need an optimized build).
[targets.rmt]
entry = "main.dodo"
board = "esp32c6_devkitc"
