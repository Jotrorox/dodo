schema = 1

[project]
name = "blink"

# board selects the chip, its startup code and linker script, and the
# package `import "std/embedded/board"` resolves to. `dodo run` flashes the board;
# `dodo build` writes a .elf and a flashable .uf2 next to it. Use
# board = "pico2" (or --board pico2) for a Raspberry Pi Pico 2.
[targets.blink]
entry = "main.dodo"
board = "pico"
