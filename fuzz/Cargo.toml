[package]
name = "dodo-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
dodoc = { package = "dodo", path = "..", default-features = false }

[features]
# The std/image targets (image_*). build.rs compiles fuzz/image with the dodo
# compiler, which must be built first; see fuzz/README.md.
image = []

# Keep the optional fuzzing dependencies out of normal frontend builds.
[workspace]
members = ["."]

[[bin]]
name = "compiler_safety"
path = "fuzz_targets/compiler_safety.rs"
test = false
doc = false
bench = false

[[bin]]
name = "image_png"
path = "fuzz_targets/image_png.rs"
required-features = ["image"]
test = false
doc = false
bench = false

[[bin]]
name = "image_bmp"
path = "fuzz_targets/image_bmp.rs"
required-features = ["image"]
test = false
doc = false
bench = false

