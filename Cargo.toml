[package]
name = "dodoc"
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
description = "The Dodo ahead-of-time compiler"
license = "BSD-2-Clause"
repository = "https://github.com/Jotrorox/dodo"

[dependencies]
# Never fall back to a shared LLVM library: installed binaries must not need LLVM.
inkwell = { version = "0.10", default-features = false, features = ["llvm22-1-force-static", "target-all"] }
lsp-server = "0.10"
lsp-types = "0.97"
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
strip = "debuginfo"

# Minimize the compiler executable with stable compiler options.
[profile.release-small]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Linux static linking flags are supplied by scripts/build-release.sh.
[profile.release-small-static]
inherits = "release-small"

[[bin]]
name = "dodo"
path = "src/main.rs"
