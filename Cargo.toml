[package]
name = "dodoc"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "The Dodo ahead-of-time compiler"
license = "BSD-2-Clause"
repository = "https://github.com/Jotrorox/dodo"

[dependencies]
inkwell = { version = "0.10", default-features = false, features = ["llvm22-1-prefer-dynamic", "target-all", "no-libffi-linking"] }
lsp-server = "0.10"
lsp-types = "0.97"
serde_json = "1"
url = "2"

[profile.release]
lto = "thin"
strip = "debuginfo"

[[bin]]
name = "dodo"
path = "src/main.rs"
