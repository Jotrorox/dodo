[package]
name = "dodo"
version = "0.1.5"
edition = "2024"
rust-version = "1.98.1"
description = "The Dodo compiler"
license = "BSD-2-Clause"
repository = "https://github.com/Jotrorox/dodo"

[lib]
name = "dodoc"

[features]
default = ["llvm", "wgsl"]
# Native code generation, the LSP server, and the CLI.
llvm = ["dep:llvm-sys", "dep:libc"]
# std/gpu's `gpu.wgsl`: WGSL shaders translated to SPIR-V, MSL and GLSL at
# compile time.
wgsl = ["dep:naga"]

[dependencies]
# llvm-sys defaults to preferring static LLVM, with a shared-library fallback.
# Release packaging explicitly enables llvm-sys/force-static.
llvm-sys = { version = "231.0.0", optional = true }
naga = { version = "30.0.1", optional = true, default-features = false, features = ["wgsl-in", "spv-out", "msl-out", "glsl-out"] }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.189", optional = true }

[profile.release]
lto = "thin"
# Keep the large symbol table of the statically linked LLVM out of releases.
strip = "symbols"

# Minimize the compiler executable with stable compiler options.
[profile.release-small]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Linux static linking flags are supplied by scripts/build-release.sh.
[profile.release-small-static]
inherits = "release-small"

[[bin]]
name = "dodo"
path = "src/main.rs"
required-features = ["llvm"]

# Tests that invoke the CLI or LLVM backend need the default feature.
# Frontend integration tests remain automatically discovered by Cargo.

