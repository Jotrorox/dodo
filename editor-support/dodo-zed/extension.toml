id = "dodo"
name = "Dodo"
version = "0.1.2"
schema_version = 1
authors = ["Jotrorox"]
description = "Dodo language support: syntax highlighting, diagnostics, completion, navigation, rename, and formatting."
repository = "https://github.com/Jotrorox/dodo"

[language_servers.dodo]
name = "Dodo Language Server"
languages = ["Dodo"]

[language_servers.dodo.language_ids]
Dodo = "dodo"

[grammars.dodo]
repository = "https://github.com/Jotrorox/dodo"
# Local development uses prepare-dev.py to snapshot the grammar from this checkout.
# Pin this to a commit containing the grammar before publishing to Zed's registry.
rev = "main"
path = "editor-support/tree-sitter-dodo"
