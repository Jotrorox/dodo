name: Build

# Tests and packages the compilers and the editor extensions. CI runs this for
# every push and pull request; the release workflow publishes its artifacts.
on:
  workflow_call:
    inputs:
      upload:
        description: Upload the packaged compilers and editor extensions as artifacts
        type: boolean
        default: false
      retention-days:
        description: Days to keep uploaded artifacts
        type: number
        default: 7
      cache:
        description: Restore and save dependency caches; false downloads and builds everything
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  vscode:
    name: VS Code extension
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: editor-support/dodo-vscode
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: ${{ inputs.cache && 'npm' || '' }}
          cache-dependency-path: editor-support/dodo-vscode/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run package
      - name: Upload the packaged VS Code extension
        if: inputs.upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dodo-vscode
          path: editor-support/dodo-vscode/*.vsix
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  jetbrains:
    name: JetBrains plugin
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: editor-support/dodo-jetbrains
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      # The CLion and RustRover distributions for verifyPlugin are about 3 GB
      # once extracted. Re-extracting them costs less than evicting the Rust and
      # LLVM caches from the repository's 10 GB cache budget.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: ${{ !inputs.cache }}
          gradle-home-cache-excludes: |
            caches/transforms-4
            caches/*/transforms
      # The language server test is skipped here and runs against the built compiler below.
      - run: ./gradlew --no-daemon test buildPlugin verifyPlugin
      - name: Upload the packaged JetBrains plugin
        if: inputs.upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dodo-jetbrains
          path: editor-support/dodo-jetbrains/build/distributions/*.zip
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  # The Linux compiler is built once per architecture and fanned out to
  # parallel test jobs; checks and the release build need their own toolchain.
  linux-checks:
    name: Linux checks / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04 x86-64
            os: ubuntu-24.04
          - name: Ubuntu 24.04 AArch64
            os: ubuntu-24.04-arm
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-toolchain
        with:
          cache: ${{ inputs.cache }}
          rust-cache: checks
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Test ELF dependency checks
        run: python3 scripts/test_check_linkage.py
      - name: Test static release prerequisites
        run: python3 scripts/test_build_release.py
      - name: Test release tag checks
        run: python3 scripts/test_check_release.py
      - name: Verify generated mathematical constants
        run: python3 scripts/generate_math_constants.py --check
      - name: Verify generated graphics fonts
        run: python3 scripts/generate_graphics_fonts.py --check
      - name: Test the OpenGL binding generator
        run: python3 scripts/test_generate_opengl.py
      - name: Verify the generated OpenGL binding against the pinned registry
        run: python3 scripts/generate_opengl.py --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  linux-debug-build:
    name: Linux debug compiler / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04 x86-64
            os: ubuntu-24.04
            arch: x86_64
          - name: Ubuntu 24.04 AArch64
            os: ubuntu-24.04-arm
            arch: aarch64
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-toolchain
        with:
          cache: ${{ inputs.cache }}
          rust-cache: debug-build
      - name: Build the debug compiler
        run: cargo build --locked --bin dodo
      - name: Verify default builds embed LLVM
        run: python3 scripts/check-linkage.py target/debug/dodo
      - name: Upload the debug compiler for the test jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: debug-dodo-${{ matrix.arch }}
          path: target/debug/dodo
          if-no-files-found: error
          retention-days: 1

  # Cargo tests are built once per architecture into a nextest archive and run
  # in parallel partitions. Within a partition nextest also spreads the test
  # binaries across all cores instead of running them one binary at a time.
  linux-test-build:
    name: Cargo test build / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04 x86-64
            os: ubuntu-24.04
            arch: x86_64
          - name: Ubuntu 24.04 AArch64
            os: ubuntu-24.04-arm
            arch: aarch64
    env:
      CARGO_TERM_COLOR: always
      # Line tables keep backtraces readable and shrink the 60-odd test binaries.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-toolchain
        with:
          cache: ${{ inputs.cache }}
          rust-cache: cargo-test
          nextest: 'true'
      - name: Build the test archive
        run: cargo nextest archive --locked --all-targets --archive-file "$RUNNER_TEMP/nextest.tar.zst"
      - name: Upload the test archive for the partitions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nextest-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/nextest.tar.zst
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  linux-cargo-test:
    name: Cargo tests / ${{ matrix.platform.name }} / ${{ matrix.partition }} of 2
    needs: linux-test-build
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Ubuntu 24.04 x86-64
            os: ubuntu-24.04
            arch: x86_64
          - name: Ubuntu 24.04 AArch64
            os: ubuntu-24.04-arm
            arch: aarch64
        partition: [1, 2]
    env:
      CARGO_TERM_COLOR: always
      DODO_REQUIRE_DEBUGGER_TESTS: "1"
      # A virtual X server for real std/window windows.
      DODO_REQUIRE_WINDOW_TESTS: "1"
      # Mesa's llvmpipe renders std/gpu/opengl contexts without a GPU.
      DODO_REQUIRE_OPENGL_TESTS: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-toolchain
        with:
          cache: ${{ inputs.cache }}
          packages: gdb xvfb xdotool x11-apps libegl1 libegl-mesa0 libgl1-mesa-dri
          nextest: 'true'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nextest-linux-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/nextest
      - name: Test compiler, native output, runtime checks, and debugger sessions
        shell: bash
        env:
          # Failing tests leave their scratch directories here for diagnostics.
          TMPDIR: ${{ runner.temp }}/dodo-tmp
        run: |
          mkdir -p "$TMPDIR" "$RUNNER_TEMP/dodo-logs"
          ulimit -c 0
          # Extracting into the checkout keeps the compiler at the path the
          # tests were built with (env!("CARGO_BIN_EXE_dodo")).
          cargo nextest run --profile ci --archive-file "$RUNNER_TEMP/nextest/nextest.tar.zst" \
            --workspace-remap . --extract-to . --partition count:${{ matrix.partition }}/2 \
            2>&1 | tee "$RUNNER_TEMP/dodo-logs/cargo-test.log"
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diagnostics-cargo-test-${{ matrix.platform.arch }}-${{ matrix.partition }}
          path: |
            ${{ runner.temp }}/dodo-logs/
            ${{ runner.temp }}/dodo-tmp/**/*.ll
            target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 7

  linux-dodo-test:
    name: Native Dodo tests / ${{ matrix.name }}
    needs: linux-debug-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04 x86-64
            os: ubuntu-24.04
            arch: x86_64
          - name: Ubuntu 24.04 AArch64
            os: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # The debug compiler embeds LLVM; the tests only need a C toolchain and OpenSSL.
      - uses: ./.github/actions/linux-toolchain
        with:
          cache: ${{ inputs.cache }}
          llvm: 'false'
          rust: 'false'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: debug-dodo-${{ matrix.arch }}
          path: target/debug
      - run: chmod +x target/debug/dodo
      - name: Test routing benchmark correctness at O0 and O3
        run: python3 scripts/test_bench_stdlib.py
      - name: Run native Dodo tests and executable documentation
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}/dodo-tmp
        run: |
          mkdir -p "$TMPDIR" "$RUNNER_TEMP/dodo-logs"
          target/debug/dodo test 2>&1 | tee "$RUNNER_TEMP/dodo-logs/dodo-test-O0.log"
          target/debug/dodo test -O 3 2>&1 | tee "$RUNNER_TEMP/dodo-logs/dodo-test-O3.log"
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diagnostics-dodo-test-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/dodo-logs/
            ${{ runner.temp }}/dodo-tmp/**/*.ll
          if-no-files-found: ignore
          retention-days: 7

  # Windows cross-checks use x86-64 MinGW and Wine; run them once.
  linux-windows-cross:
    name: Windows cross-checks / Wine
    needs: linux-debug-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # LLVM provides clang and lld-link for the Windows targets.
      - uses: ./.github/actions/linux-toolchain
        with:
          cache: ${{ inputs.cache }}
          packages: wine64 mingw-w64-x86-64-dev
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: debug-dodo-x86_64
          path: target/debug
      - run: chmod +x target/debug/dodo
      - name: Test Windows fixture startup ABI
        run: python3 scripts/test_windows_startup.py
      - name: Test native Windows fixture runner diagnostics
        run: python3 scripts/test_windows_native_harness.py
      - name: Test Windows LLVM library path handling
        run: |
          rustc --edition=2024 --test scripts/windows-llvm-config.rs -o "$RUNNER_TEMP/test-windows-llvm-config"
          "$RUNNER_TEMP/test-windows-llvm-config"
      - name: Execute Windows core and alloc programs in Wine
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}/dodo-tmp
        run: |
          mkdir -p "$TMPDIR" "$RUNNER_TEMP/dodo-logs"
          python3 scripts/test_stdlib_windows.py 2>&1 | tee "$RUNNER_TEMP/dodo-logs/stdlib-windows.log"
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diagnostics-windows-cross
          path: |
            ${{ runner.temp }}/dodo-logs/
            ${{ runner.temp }}/dodo-tmp/**/*.ll
          if-no-files-found: ignore
          retention-days: 7

  # The editor integration test is platform independent; run it once.
  vscode-integration:
    name: VS Code against the built compiler
    needs: linux-debug-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: editor-support/dodo-vscode
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: ${{ inputs.cache && 'npm' || '' }}
          cache-dependency-path: editor-support/dodo-vscode/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: debug-dodo-x86_64
          path: target/debug
      - run: chmod +x ../../target/debug/dodo
      - run: sudo apt-get install --no-install-recommends -y xvfb
      - run: npm ci
      - run: xvfb-run -a npm run test:integration

  jetbrains-integration:
    name: JetBrains plugin against the built compiler
    needs: linux-debug-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: editor-support/dodo-jetbrains
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      # Restores the plugin job's cache; only that job writes one.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: ${{ !inputs.cache }}
          cache-read-only: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: debug-dodo-x86_64
          path: target/debug
      # Fails if the artifact is missing, so the test cannot silently skip.
      - run: chmod +x ../../target/debug/dodo
      - run: ./gradlew --no-daemon test --tests '*DodoLspIntegrationTest'

  linux-release:
    name: Linux release / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04 x86-64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64-compilers
          - name: Ubuntu 24.04 AArch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: linux-aarch64-compilers
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-toolchain
        with:
          cache: ${{ inputs.cache }}
          rust-cache: release
      - name: Build self-contained release compiler
        run: bash scripts/build-release.sh
      - name: Verify release only needs standard Linux runtime libraries
        run: python3 scripts/check-linkage.py target/${{ matrix.target }}/release/dodo --release
      - name: Build and verify fully static size-focused compiler
        run: bash scripts/build-release.sh release-small-static
      - name: Compile and run without an LLVM installation
        shell: bash
        run: |
          set -euo pipefail
          for profile in release release-small-static; do
            docker run --rm \
              --mount type=bind,source="$PWD/target/${{ matrix.target }}/$profile/dodo",target=/usr/local/bin/dodo,readonly \
              --mount type=bind,source="$PWD/examples",target=/examples,readonly \
              ubuntu:24.04 bash -euo pipefail -c '
                if command -v llvm-config || command -v cc; then
                  echo "The runtime smoke test requires a clean image without compiler tools." >&2
                  exit 1
                fi
                dodo --version
                dodo check /examples/hello.dodo
                dodo build /examples/hello.dodo --emit llvm-ir -O 2 -o /tmp/hello.ll
                dodo build /examples/hello.dodo --emit obj -O 2 -o /tmp/hello.o
                dodo build /examples/io.dodo --emit obj --target wasm32-unknown-unknown -O 2 -o /tmp/hello.wasm
                test -s /tmp/hello.ll
                test -s /tmp/hello.o
                test -s /tmp/hello.wasm
                apt-get update
                apt-get install --no-install-recommends -y build-essential
                if command -v llvm-config; then
                  echo "The C toolchain unexpectedly installed LLVM." >&2
                  exit 1
                fi
                dodo build /examples/hello.dodo -O 2 -o /tmp/hello
                test "$(/tmp/hello)" = "Hello, world!"
                test "$(dodo run /examples/hello.dodo -O 2)" = "Hello, world!"
              '
          done
      - name: Package the verified Linux release
        run: python3 scripts/package-release.py --target ${{ matrix.target }}
      - name: Upload verified Linux compilers
        if: inputs.upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: build/release-assets/
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  # macOS mirrors Linux: one job builds the tests and the debug compiler, which
  # fan out to parallel test jobs; the release build runs alongside.
  macos-build:
    name: macOS build and clippy / macOS 15 Apple silicon
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      # Line tables keep backtraces readable and shrink the 60-odd test binaries.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/macos-toolchain
        with:
          cache: ${{ inputs.cache }}
          rust-cache: test
          nextest: 'true'
      - name: Test Mach-O dependency checks
        run: python3 scripts/test_check_linkage.py
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build the test archive
        run: cargo nextest archive --locked --all-targets --archive-file "$RUNNER_TEMP/nextest.tar.zst"
      - name: Upload the test archive for the partitions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nextest-macos-aarch64
          path: ${{ runner.temp }}/nextest.tar.zst
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Upload the debug compiler for the native Dodo tests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: debug-dodo-macos-aarch64
          path: target/debug/dodo
          if-no-files-found: error
          retention-days: 1

  macos-cargo-test:
    name: Cargo tests / macOS 15 Apple silicon / ${{ matrix.partition }} of 2
    needs: macos-build
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2]
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/macos-toolchain
        with:
          cache: ${{ inputs.cache }}
          nextest: 'true'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nextest-macos-aarch64
          path: ${{ runner.temp }}/nextest
      - name: Test compiler, native output, and runtime checks
        shell: bash
        env:
          # Failing tests leave their scratch directories here for diagnostics.
          TMPDIR: ${{ runner.temp }}/dodo-tmp
        run: |
          mkdir -p "$TMPDIR" "$RUNNER_TEMP/dodo-logs"
          ulimit -c 0
          # Extracting into the checkout keeps the compiler at the path the
          # tests were built with (env!("CARGO_BIN_EXE_dodo")).
          cargo nextest run --profile ci --archive-file "$RUNNER_TEMP/nextest/nextest.tar.zst" \
            --workspace-remap . --extract-to . --partition count:${{ matrix.partition }}/2 \
            2>&1 | tee "$RUNNER_TEMP/dodo-logs/cargo-test.log"
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diagnostics-cargo-test-macos-aarch64-${{ matrix.partition }}
          path: |
            ${{ runner.temp }}/dodo-logs/
            ${{ runner.temp }}/dodo-tmp/**/*.ll
            target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 7

  macos-dodo-test:
    name: Native Dodo tests / macOS 15 Apple silicon
    needs: macos-build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # The debug compiler embeds LLVM; the tests need the C toolchain and OpenSSL.
      - uses: ./.github/actions/macos-toolchain
        with:
          cache: ${{ inputs.cache }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: debug-dodo-macos-aarch64
          path: target/debug
      - run: chmod +x target/debug/dodo
      - name: Test routing benchmark correctness at O0 and O3
        run: python3 scripts/test_bench_stdlib.py
      - name: Run native Dodo tests and executable documentation
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}/dodo-tmp
        run: |
          mkdir -p "$TMPDIR" "$RUNNER_TEMP/dodo-logs"
          target/debug/dodo test 2>&1 | tee "$RUNNER_TEMP/dodo-logs/dodo-test-O0.log"
          target/debug/dodo test -O 3 2>&1 | tee "$RUNNER_TEMP/dodo-logs/dodo-test-O3.log"
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diagnostics-dodo-test-macos-aarch64
          path: |
            ${{ runner.temp }}/dodo-logs/
            ${{ runner.temp }}/dodo-tmp/**/*.ll
          if-no-files-found: ignore
          retention-days: 7

  macos-release:
    name: macOS release / macOS 15 Apple silicon
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/macos-toolchain
        with:
          cache: ${{ inputs.cache }}
          rust-cache: release-${{ hashFiles('scripts/build-release-macos.sh') }}
      - name: Build self-contained release compiler
        run: bash scripts/build-release-macos.sh
      - name: Package the verified macOS release
        run: python3 scripts/package-release.py --target aarch64-apple-darwin
      - name: Test the extracted macOS release
        shell: bash
        run: |
          set -euo pipefail
          extracted="$RUNNER_TEMP/dodo-release"
          mkdir -p "$extracted"
          tar -xJf build/release-assets/dodo-*-aarch64-apple-darwin.tar.xz -C "$extracted"
          dodo=$(echo "$extracted"/dodo-*/dodo)
          python3 scripts/check-linkage.py "$dodo" --release
          # Run without the build environment's LLVM or Homebrew libraries.
          env -i PATH=/usr/bin:/bin HOME="$HOME" "$dodo" --version
          env -i PATH=/usr/bin:/bin HOME="$HOME" "$dodo" build examples/hello.dodo -O 2 -o "$RUNNER_TEMP/hello"
          test "$("$RUNNER_TEMP/hello")" = "Hello, world!"
          test "$(env -i PATH=/usr/bin:/bin HOME="$HOME" "$dodo" run examples/hello.dodo -O 2)" = "Hello, world!"
      - name: Upload the verified macOS compiler
        if: inputs.upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-arm64-compiler
          path: build/release-assets/*.tar.xz
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  windows-compiler:
    name: Windows x86-64 release / LLVM 23
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy, rust-docs
          targets: x86_64-pc-windows-msvc
      - name: Configure Windows LLVM
        id: windows-toolchain
        shell: pwsh
        run: |
          $prefix = "$env:RUNNER_TEMP/llvm-windows"
          "LLVM_SYS_231_PREFIX=$prefix" >> $env:GITHUB_ENV
          "$prefix/bin" >> $env:GITHUB_PATH
          "image=$env:ImageVersion" >> $env:GITHUB_OUTPUT
      - name: Restore Windows LLVM and static support libraries
        if: inputs.cache
        id: windows-llvm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/llvm-windows
          key: llvm-windows-2022-${{ runner.arch }}-${{ steps.windows-toolchain.outputs.image }}-${{ hashFiles('.github/workflows/build.yml', 'scripts/build-windows-llvm-support.py', 'scripts/windows-llvm-config.rs') }}
      - name: Download and verify the official LLVM 23 Windows archive
        if: steps.windows-llvm-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = "$env:RUNNER_TEMP/llvm-windows.tar.xz"
          Write-Host 'Downloading the Windows LLVM development archive'
          curl.exe --fail --location --retry 5 --retry-all-errors --connect-timeout 30 --max-time 300 --retry-max-time 600 'https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.1/clang%2Bllvm-23.1.1-x86_64-pc-windows-msvc.tar.xz' --output $archive
          if ($LASTEXITCODE -ne 0) { throw 'LLVM archive download failed after retries' }
          Write-Host 'Verifying the Windows LLVM archive checksum'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'C54AC8146B420FE72E11E6FDD56498D6818011AD23267196B6AB37B5AC9264C3') {
            throw 'LLVM archive checksum mismatch'
          }
      - name: Extract the required Windows LLVM tools and libraries
        if: steps.windows-llvm-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = "$env:RUNNER_TEMP/llvm-windows.tar.xz"
          $tarArchive = "$env:RUNNER_TEMP/llvm-windows.tar"
          $prefix = "$env:RUNNER_TEMP/llvm-windows"
          New-Item -ItemType Directory -Path $prefix | Out-Null
          # Windows tar stalls on this XZ archive; decompress it with 7-Zip first.
          7z x $archive "-o$env:RUNNER_TEMP" -y -bsp0
          if ($LASTEXITCODE -ne 0) { throw 'LLVM archive decompression failed' }
          # Avoid extracting and caching over 3 GB of unused LLVM executables.
          $root = 'clang+llvm-23.1.1-x86_64-pc-windows-msvc'
          $members = @(
            "$root/include", "$root/lib",
            "$root/bin/clang.exe", "$root/bin/lld-link.exe",
            "$root/bin/llvm-config.exe", "$root/bin/llvm-readobj.exe"
          )
          tar -xf $tarArchive -C $prefix --strip-components=1 @members
          if ($LASTEXITCODE -ne 0) { throw 'LLVM archive extraction failed' }
          Remove-Item $archive, $tarArchive
      - name: Build LLVM's missing static support libraries and collect notices
        if: steps.windows-llvm-cache.outputs.cache-hit != 'true'
        run: python scripts/build-windows-llvm-support.py
      - name: Verify Windows LLVM system libraries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $config = "$env:LLVM_SYS_231_PREFIX/bin/llvm-config-23.exe"
          $version = & $config --version
          if ($LASTEXITCODE -ne 0 -or $version -ne '23.1.1') { throw 'Unexpected Windows LLVM version' }
          $libraries = & $config --link-static --system-libs
          if ($LASTEXITCODE -ne 0) { throw 'Windows LLVM system library verification failed' }
          Write-Host "LLVM system libraries: $libraries"
          if ($libraries -match '[:/\\]') { throw 'LLVM system libraries must use bare library names' }
          foreach ($library in @('xml2s.lib', 'zs.lib', 'zstd_static.lib')) {
            if (!(Test-Path "$env:LLVM_SYS_231_PREFIX/lib/$library")) { throw "Missing LLVM dependency: $library" }
          }
      - name: Save Windows LLVM and static support libraries
        if: inputs.cache && steps.windows-llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/llvm-windows
          key: ${{ steps.windows-llvm-cache.outputs.cache-primary-key }}
      - name: Cache Rust dependencies and build artifacts
        if: inputs.cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ steps.windows-llvm-cache.outputs.cache-primary-key }}
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST LLVM_SYS
          cache-bin: false
          cache-on-failure: true
          # Pull requests restore main's cache without saving their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the Windows compiler with static runtimes
        run: cargo build --locked --features llvm-sys/force-static --release --bin dodo --target x86_64-pc-windows-msvc
      - name: Test native Windows filesystem, processes, networking, and synchronization
        timeout-minutes: 15
        shell: pwsh
        run: |
          python scripts/test_windows_native_harness.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows fixture runner tests failed' }
          python scripts/test_windows_native.py --linker "$env:LLVM_SYS_231_PREFIX/bin/clang.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows platform tests failed' }
      - name: Package the Windows release
        run: python scripts/package-release.py --target x86_64-pc-windows-msvc
      - name: Test the extracted Windows release
        shell: pwsh
        run: |
          $archive = Get-ChildItem build/release-assets/dodo-*-x86_64-pc-windows-msvc.zip
          python scripts/test_windows_release.py $archive.FullName --linker "$env:LLVM_SYS_231_PREFIX/bin/clang.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Windows release smoke test failed' }
      - name: Upload the verified Windows compiler
        if: inputs.upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x86_64-compiler
          path: build/release-assets/*.zip
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
