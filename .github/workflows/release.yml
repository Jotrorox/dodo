name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Check tag against version and changelog
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      notes: ${{ steps.check.outputs.notes }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Test release tag checks
        run: python3 scripts/test_check_release.py
      - name: Check the tag, Cargo.toml, package.json, and CHANGELOG.md
        id: check
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 scripts/check_release.py "$GITHUB_REF_NAME" --notes "$RUNNER_TEMP/notes.md")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          delimiter="notes-$(openssl rand -hex 16)"
          {
            echo "notes<<$delimiter"
            cat "$RUNNER_TEMP/notes.md"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: verify
    uses: ./.github/workflows/build.yml
    with:
      upload: true

  publish:
    name: Publish GitHub Release
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Download the packaged compilers and VS Code extension
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets
          # Skip the debug compilers that the build's test jobs share.
          pattern: '{dodo-vscode,*-compiler,*-compilers}'
          merge-multiple: true
      # Publish exactly the expected files, so stray build output never ships.
      - name: Check release assets and write SHA256SUMS
        shell: bash
        working-directory: assets
        run: |
          set -euo pipefail
          expected=(
            "dodo-$VERSION-aarch64-apple-darwin.tar.xz"
            "dodo-$VERSION-aarch64-unknown-linux-gnu.tar.xz"
            "dodo-$VERSION-x86_64-pc-windows-msvc.zip"
            "dodo-$VERSION-x86_64-unknown-linux-gnu.tar.xz"
            "dodo-vscode-$VERSION.vsix"
          )
          actual=$(find . -type f -printf '%P\n' | LC_ALL=C sort)
          if [[ "$actual" != "$(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)" ]]; then
            printf 'Unexpected release assets:\n%s\n' "$actual" >&2
            exit 1
          fi
          sha256sum -- "${expected[@]}" > SHA256SUMS
          cat SHA256SUMS
          {
            echo '| Asset | Size |'
            echo '| --- | ---: |'
            for asset in "${expected[@]}"; do
              echo "| \`$asset\` | $(numfmt --to=iec-i --suffix=B "$(stat -c %s "$asset")") |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: assets/SHA256SUMS
      - name: Create the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ needs.verify.outputs.notes }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Dodo $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${prerelease[@]}"
