name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zed:
    name: Zed extension and Tree-sitter grammar
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: editor-support/tree-sitter-dodo/package-lock.json
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - name: Test grammar, highlights, and Zed queries
        working-directory: editor-support/tree-sitter-dodo
        run: |
          npm ci
          npm test
          git diff --exit-code -- src
      - name: Check and build the extension
        working-directory: editor-support/dodo-zed
        run: |
          cargo fmt -- --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
          cargo build --locked --release --target wasm32-wasip2
          python3 -m unittest discover -p 'test_*.py'
          python3 prepare-dev.py

  vscode:
    name: VS Code extension
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: editor-support/dodo-vscode
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: editor-support/dodo-vscode/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run package
      - name: Upload the packaged VS Code extension
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dodo-vscode
          path: editor-support/dodo-vscode/*.vsix
          if-no-files-found: error
          retention-days: 7

  compiler:
    name: Rust and LLVM 23 / Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      DODO_REQUIRE_DEBUGGER_TESTS: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Install native build prerequisites
        id: llvm
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential zlib1g-dev libzstd-dev libxml2-dev libffi-dev curl xz-utils gdb xvfb
          # Rebuild native caches when the installed compiler or libraries change.
          fingerprint=$({
            cc --version
            c++ --version
            dpkg-query -W gcc g++ libc6-dev zlib1g-dev libzstd-dev libxml2-dev libffi-dev
          } | sha256sum | cut -d ' ' -f 1)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "LLVM_SYS_231_PREFIX=$RUNNER_TEMP/llvm-linux" >> "$GITHUB_ENV"
      - name: Restore official LLVM 23 without Z3
        id: linux-llvm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.LLVM_SYS_231_PREFIX }}
          key: llvm-linux-x64-${{ hashFiles('scripts/install-linux-llvm.py') }}
      - name: Download and verify the official LLVM 23 Linux archive
        if: steps.linux-llvm-cache.outputs.cache-hit != 'true'
        run: python3 scripts/install-linux-llvm.py
      - name: Configure and verify LLVM
        shell: bash
        run: |
          set -euo pipefail
          echo "$LLVM_SYS_231_PREFIX/bin" >> "$GITHUB_PATH"
          test "$("$LLVM_SYS_231_PREFIX/bin/llvm-config" --version)" = 23.1.1
          libraries=$("$LLVM_SYS_231_PREFIX/bin/llvm-config" --link-static --system-libs)
          echo "LLVM system libraries: $libraries"
          if [[ "$libraries" == *z3* ]]; then
            echo 'The Linux release toolchain must not require Z3.' >&2
            exit 1
          fi
      - name: Save official LLVM 23
        if: steps.linux-llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.LLVM_SYS_231_PREFIX }}
          key: ${{ steps.linux-llvm-cache.outputs.cache-primary-key }}
      - name: Restore OpenSSL for TLS fixtures
        id: openssl-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dodo-openssl
          # The workflow contains the source checksum and Configure options.
          key: openssl-ubuntu-24.04-${{ runner.arch }}-${{ steps.llvm.outputs.fingerprint }}-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Build the maintained OpenSSL backend for TLS fixtures
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test_tls_prefix="$RUNNER_TEMP/dodo-openssl"
          test_tls_archive="$RUNNER_TEMP/openssl-3.5.8.tar.gz"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --connect-timeout 30 --max-time 300 --retry-max-time 600 https://github.com/openssl/openssl/releases/download/openssl-3.5.8/openssl-3.5.8.tar.gz -o "$test_tls_archive"
          printf '%s  %s\n' a8f84a39918ec6415ce765d9b429d313ba97b8143169c172e734b9514464f5b2 "$test_tls_archive" | sha256sum --check
          tar -xzf "$test_tls_archive" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/openssl-3.5.8"
          ./Configure --prefix="$test_tls_prefix" --libdir=lib no-shared no-tests
          make -j2
          # install_sw omits openssl.cnf, which TLS credential generation needs.
          make install_sw install_ssldirs
      - name: Configure OpenSSL for TLS fixtures
        shell: bash
        run: |
          set -euo pipefail
          test_tls_prefix="$RUNNER_TEMP/dodo-openssl"
          test -s "$test_tls_prefix/ssl/openssl.cnf"
          "$test_tls_prefix/bin/openssl" version
          echo "CPATH=$test_tls_prefix/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$test_tls_prefix/lib" >> "$GITHUB_ENV"
          echo "$test_tls_prefix/bin" >> "$GITHUB_PATH"
      # Save native dependencies before later tests can fail or cancel the job.
      - name: Save OpenSSL for TLS fixtures
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dodo-openssl
          key: ${{ steps.openssl-cache.outputs.cache-primary-key }}
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ubuntu-24.04-${{ steps.llvm.outputs.fingerprint }}-${{ hashFiles('.github/workflows/ci.yml', 'scripts/build-release.sh', 'scripts/link-static.sh', 'scripts/install-linux-llvm.py') }}
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST LLVM_SYS CPATH LIBRARY_PATH
          cache-bin: false
          cache-on-failure: true
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Test ELF dependency checks
        run: python3 scripts/test_check_linkage.py
      - name: Test static release prerequisites
        run: python3 scripts/test_build_release.py
      - name: Test Windows fixture startup ABI
        run: python3 scripts/test_windows_startup.py
      - name: Verify generated mathematical constants
        run: python3 scripts/generate_math_constants.py --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test compiler, native output, runtime checks, and debugger sessions
        shell: bash
        run: |
          ulimit -c 0
          cargo test --locked --all-targets
      - name: Run native Dodo tests and executable documentation
        run: |
          target/debug/dodo test
          target/debug/dodo test -O 3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: editor-support/dodo-vscode/package-lock.json
      - name: Test VS Code against the built compiler
        working-directory: editor-support/dodo-vscode
        run: |
          npm ci
          xvfb-run -a npm run test:integration
      - name: Install Windows standard-library test tools
        run: sudo apt-get install --no-install-recommends -y wine64 mingw-w64-x86-64-dev
      - name: Execute Windows core and alloc programs in Wine
        run: python3 scripts/test_stdlib_windows.py
      - name: Verify default builds embed LLVM
        run: python3 scripts/check-linkage.py target/debug/dodo
      - name: Build self-contained release compiler
        run: bash scripts/build-release.sh
      - name: Verify release only needs standard Linux runtime libraries
        run: python3 scripts/check-linkage.py target/x86_64-unknown-linux-gnu/release/dodo --release
      - name: Build and verify fully static size-focused compiler
        run: bash scripts/build-release.sh release-small-static
      - name: Compile and run without an LLVM installation
        shell: bash
        run: |
          set -euo pipefail
          for profile in release release-small-static; do
            docker run --rm \
              --mount type=bind,source="$PWD/target/x86_64-unknown-linux-gnu/$profile/dodo",target=/usr/local/bin/dodo,readonly \
              --mount type=bind,source="$PWD/examples",target=/examples,readonly \
              ubuntu:24.04 bash -euo pipefail -c '
                if command -v llvm-config || command -v cc; then
                  echo "The runtime smoke test requires a clean image without compiler tools." >&2
                  exit 1
                fi
                dodo --version
                dodo check /examples/hello.dodo
                dodo build /examples/hello.dodo --emit llvm-ir -O 2 -o /tmp/hello.ll
                dodo build /examples/hello.dodo --emit obj -O 2 -o /tmp/hello.o
                dodo build /examples/io.dodo --emit obj --target wasm32-unknown-unknown -O 2 -o /tmp/hello.wasm
                test -s /tmp/hello.ll
                test -s /tmp/hello.o
                test -s /tmp/hello.wasm
                apt-get update
                apt-get install --no-install-recommends -y build-essential
                if command -v llvm-config; then
                  echo "The C toolchain unexpectedly installed LLVM." >&2
                  exit 1
                fi
                dodo build /examples/hello.dodo -O 2 -o /tmp/hello
                test "$(/tmp/hello)" = "Hello, world!"
                test "$(dodo run /examples/hello.dodo -O 2)" = "Hello, world!"
              '
          done
      - name: Package the verified Linux release
        run: python3 scripts/package-release.py
      - name: Upload verified Linux compilers
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-x86_64-compilers
          path: build/release-assets/
          if-no-files-found: error
          retention-days: 7

  windows-compiler:
    name: Windows x86-64 release / LLVM 23
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          components: rust-docs
          targets: x86_64-pc-windows-msvc
      - name: Configure Windows LLVM
        id: windows-toolchain
        shell: pwsh
        run: |
          $prefix = "$env:RUNNER_TEMP/llvm-windows"
          "LLVM_SYS_231_PREFIX=$prefix" >> $env:GITHUB_ENV
          "$prefix/bin" >> $env:GITHUB_PATH
          "image=$env:ImageVersion" >> $env:GITHUB_OUTPUT
      - name: Restore Windows LLVM and static XML support
        id: windows-llvm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/llvm-windows
          key: llvm-windows-2022-${{ runner.arch }}-${{ steps.windows-toolchain.outputs.image }}-${{ hashFiles('.github/workflows/ci.yml', 'scripts/build-windows-llvm-support.py') }}
      - name: Download and verify the official LLVM 23 Windows archive
        if: steps.windows-llvm-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = "$env:RUNNER_TEMP/llvm-windows.tar.xz"
          Write-Host 'Downloading the Windows LLVM development archive'
          curl.exe --fail --location --retry 5 --retry-all-errors --connect-timeout 30 --max-time 300 --retry-max-time 600 'https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.1/clang%2Bllvm-23.1.1-x86_64-pc-windows-msvc.tar.xz' --output $archive
          if ($LASTEXITCODE -ne 0) { throw 'LLVM archive download failed after retries' }
          Write-Host 'Verifying the Windows LLVM archive checksum'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'C54AC8146B420FE72E11E6FDD56498D6818011AD23267196B6AB37B5AC9264C3') {
            throw 'LLVM archive checksum mismatch'
          }
      - name: Extract the required Windows LLVM tools and libraries
        if: steps.windows-llvm-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = "$env:RUNNER_TEMP/llvm-windows.tar.xz"
          $tarArchive = "$env:RUNNER_TEMP/llvm-windows.tar"
          $prefix = "$env:RUNNER_TEMP/llvm-windows"
          New-Item -ItemType Directory -Path $prefix | Out-Null
          # Windows tar stalls on this XZ archive; decompress it with 7-Zip first.
          7z x $archive "-o$env:RUNNER_TEMP" -y -bsp0
          if ($LASTEXITCODE -ne 0) { throw 'LLVM archive decompression failed' }
          # Avoid extracting and caching over 3 GB of unused LLVM executables.
          $root = 'clang+llvm-23.1.1-x86_64-pc-windows-msvc'
          $members = @(
            "$root/include", "$root/lib",
            "$root/bin/clang.exe", "$root/bin/lld-link.exe",
            "$root/bin/llvm-config.exe", "$root/bin/llvm-readobj.exe"
          )
          tar -xf $tarArchive -C $prefix --strip-components=1 @members
          if ($LASTEXITCODE -ne 0) { throw 'LLVM archive extraction failed' }
          Remove-Item $archive, $tarArchive
      - name: Build LLVM's missing static XML library and collect notices
        if: steps.windows-llvm-cache.outputs.cache-hit != 'true'
        run: python scripts/build-windows-llvm-support.py
      - name: Save Windows LLVM and static XML support
        if: steps.windows-llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/llvm-windows
          key: ${{ steps.windows-llvm-cache.outputs.cache-primary-key }}
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ steps.windows-llvm-cache.outputs.cache-primary-key }}
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST LLVM_SYS
          cache-bin: false
          cache-on-failure: true
      - name: Build the Windows compiler with static runtimes
        run: cargo build --locked --features llvm-sys/force-static --release --bin dodo --target x86_64-pc-windows-msvc
      - name: Package the Windows release
        run: python scripts/package-release.py --target x86_64-pc-windows-msvc
      - name: Test the extracted Windows release
        shell: pwsh
        run: |
          $archive = Get-ChildItem build/release-assets/dodo-*-x86_64-pc-windows-msvc.zip
          python scripts/test_windows_release.py $archive.FullName --linker "$env:LLVM_SYS_231_PREFIX/bin/clang.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Windows release smoke test failed' }
      - name: Upload the verified Windows compiler
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x86_64-compiler
          path: build/release-assets/*.zip
          if-no-files-found: error
          retention-days: 7
