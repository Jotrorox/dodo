name: CI

on:
  push:
    # Release tags are built by the release workflow.
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Rust frontend / no LLVM / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # macos-15 uses Apple Silicon (arm64).
        os: [ubuntu-24.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Cache frontend build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: frontend-no-llvm-${{ matrix.os }}
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy without LLVM
        run: cargo clippy --locked --no-default-features --all-targets -- -D warnings
      - name: Test frontend without LLVM
        run: cargo test --locked --no-default-features --all-targets

  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      upload: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
