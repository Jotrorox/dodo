name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vscode:
    name: VS Code extension
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: editor-support/dodo-vscode
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: editor-support/dodo-vscode/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run package

  compiler:
    name: Rust and LLVM 22 / Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LLVM_SYS_221_PREFIX: /usr/lib/llvm-22
      CARGO_TERM_COLOR: always
      DODO_REQUIRE_DEBUGGER_TESTS: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Install LLVM 22 from the official signed repository
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://apt.llvm.org/llvm-snapshot.gpg.key -o /tmp/llvm-signing-key.asc
          gpg --show-keys --with-colons /tmp/llvm-signing-key.asc | awk -F: '$1 == "fpr" {print $10}' > /tmp/llvm-fingerprints
          grep -Fx '6084F3CF814B57C1CF12EFD515CF4D18AF4F7421' /tmp/llvm-fingerprints
          sudo install -m 644 /tmp/llvm-signing-key.asc /usr/share/keyrings/llvm.asc
          echo 'deb [signed-by=/usr/share/keyrings/llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | sudo tee /etc/apt/sources.list.d/llvm22.list
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y llvm-22-dev libpolly-22-dev clang-22 build-essential zlib1g-dev libzstd-dev libffi-dev libz3-dev cmake ninja-build gdb xvfb
          /usr/lib/llvm-22/bin/llvm-config --version
      - name: Build the maintained OpenSSL backend for TLS fixtures
        shell: bash
        run: |
          set -euo pipefail
          test_tls_prefix="$RUNNER_TEMP/dodo-openssl"
          test_tls_archive="$RUNNER_TEMP/openssl-3.5.8.tar.gz"
          curl --fail --silent --show-error --location https://github.com/openssl/openssl/releases/download/openssl-3.5.8/openssl-3.5.8.tar.gz -o "$test_tls_archive"
          printf '%s  %s\n' a8f84a39918ec6415ce765d9b429d313ba97b8143169c172e734b9514464f5b2 "$test_tls_archive" | sha256sum --check
          tar -xzf "$test_tls_archive" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/openssl-3.5.8"
          ./Configure --prefix="$test_tls_prefix" --libdir=lib no-shared no-tests
          make -j2
          # install_sw omits openssl.cnf, which TLS credential generation needs.
          make install_sw install_ssldirs
          echo "CPATH=$test_tls_prefix/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$test_tls_prefix/lib" >> "$GITHUB_ENV"
          echo "$test_tls_prefix/bin" >> "$GITHUB_PATH"
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Test ELF dependency checks
        run: python3 scripts/test_check_linkage.py
      - name: Test static release prerequisites
        run: python3 scripts/test_build_release.py
      - name: Verify generated mathematical constants
        run: python3 scripts/generate_math_constants.py --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test compiler, native output, runtime checks, and debugger sessions
        shell: bash
        run: |
          ulimit -c 0
          cargo test --locked --all-targets
      - name: Run native Dodo tests and executable documentation
        run: |
          target/debug/dodo test
          target/debug/dodo test -O 3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: editor-support/dodo-vscode/package-lock.json
      - name: Test VS Code against the built compiler
        working-directory: editor-support/dodo-vscode
        run: |
          npm ci
          xvfb-run -a npm run test:integration
      - name: Install Windows standard-library test tools
        run: sudo apt-get install --no-install-recommends -y lld-22 wine64 mingw-w64-x86-64-dev
      - name: Execute Windows core and alloc programs in Wine
        run: python3 scripts/test_stdlib_windows.py
      - name: Verify default builds embed LLVM
        run: python3 scripts/check-linkage.py target/debug/dodo
      - name: Build self-contained release compiler
        run: bash scripts/build-release.sh
      - name: Verify release only needs standard Linux runtime libraries
        run: python3 scripts/check-linkage.py target/x86_64-unknown-linux-gnu/release/dodo --release
      - name: Build and verify fully static size-focused compiler
        shell: bash
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 4
        run: |
          set -euo pipefail
          bash scripts/build-static-z3.sh
          export LIBRARY_PATH="$PWD/target/static-deps/lib${LIBRARY_PATH:+:$LIBRARY_PATH}"
          bash scripts/build-release.sh release-small-static
      - name: Compile and run without an LLVM installation
        shell: bash
        run: |
          set -euo pipefail
          for profile in release release-small-static; do
            docker run --rm \
              --mount type=bind,source="$PWD/target/x86_64-unknown-linux-gnu/$profile/dodo",target=/usr/local/bin/dodo,readonly \
              --mount type=bind,source="$PWD/examples",target=/examples,readonly \
              ubuntu:24.04 bash -euo pipefail -c '
                if command -v llvm-config || command -v cc; then
                  echo "The runtime smoke test requires a clean image without compiler tools." >&2
                  exit 1
                fi
                dodo --version
                dodo check /examples/hello.dodo
                dodo build /examples/hello.dodo --emit llvm-ir -O 2 -o /tmp/hello.ll
                dodo build /examples/hello.dodo --emit obj -O 2 -o /tmp/hello.o
                dodo build /examples/hello.dodo --emit obj --target wasm32-unknown-unknown -O 2 -o /tmp/hello.wasm
                test -s /tmp/hello.ll
                test -s /tmp/hello.o
                test -s /tmp/hello.wasm
                apt-get update
                apt-get install --no-install-recommends -y build-essential
                if command -v llvm-config; then
                  echo "The C toolchain unexpectedly installed LLVM." >&2
                  exit 1
                fi
                dodo build /examples/hello.dodo -O 2 -o /tmp/hello
                test "$(/tmp/hello)" = "Dodo 0.1"
                test "$(dodo run /examples/hello.dodo -O 2)" = "Dodo 0.1"
              '
          done
      - name: Package the verified Linux release
        run: python3 scripts/package-release.py
      - name: Upload verified Linux compilers
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-x86_64-compilers
          path: build/release-assets/
          if-no-files-found: error
          retention-days: 7
