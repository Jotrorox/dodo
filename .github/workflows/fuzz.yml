name: Nightly fuzzing

# Coverage-guided fuzzing of compiler_safety. Regular CI only runs the
# deterministic seeds; this grows a corpus across runs in the Actions cache.
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: Fuzzing time in seconds
        type: number
        default: 1800

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compiler-safety:
    name: compiler_safety
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CORPUS: ${{ github.workspace }}/fuzz/corpus-cache/compiler_safety
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: nightly
      - name: Cache cargo-fuzz and fuzz build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
          key: fuzz
      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz --version 0.13.2
      - name: Restore the generated corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CORPUS }}
          key: fuzz-corpus-compiler_safety-${{ github.run_id }}
          restore-keys: fuzz-corpus-compiler_safety-
      - name: Fuzz compiler_safety
        env:
          SECONDS_TO_FUZZ: ${{ inputs.seconds || 1800 }}
        run: |
          mkdir -p "$CORPUS"
          echo "Starting with $(find "$CORPUS" -type f | wc -l) cached inputs"
          # New inputs go to the first (cached) directory; the tracked seeds
          # are read but never modified.
          cargo +nightly fuzz run compiler_safety "$CORPUS" fuzz/corpus/compiler_safety -- \
            -max_len=128 -timeout=30 -fork="$(nproc)" -max_total_time="$SECONDS_TO_FUZZ"
      - name: Minimize the generated corpus
        run: |
          cargo +nightly fuzz cmin compiler_safety "$CORPUS" -- -max_len=128 -timeout=30
          echo "Keeping $(find "$CORPUS" -type f | wc -l) inputs"
      # Keep coverage found before a crash; the crash itself is uploaded below.
      - name: Save the generated corpus
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CORPUS }}
          key: fuzz-corpus-compiler_safety-${{ github.run_id }}
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts-compiler_safety
          path: fuzz/artifacts/compiler_safety/
          if-no-files-found: ignore
          retention-days: 30
