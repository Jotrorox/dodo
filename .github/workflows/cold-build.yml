name: Cold-cache build

# Runs the full build without dependency caches, so a dead LLVM or OpenSSL
# download URL, or a changed apt or Homebrew package, fails here before a
# release depends on it.
on:
  schedule:
    - cron: '29 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      cache: false
